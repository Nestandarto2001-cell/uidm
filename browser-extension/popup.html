<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #1f2937;
      color: white;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .connected {
      background: #065f46;
      border: 1px solid #10b981;
    }
    .disconnected {
      background: #7f1d1d;
      border: 1px solid #ef4444;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px 0;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <h3>MEXC Terminal Connector</h3>
  
  <div id="status" class="status disconnected">
    Отключен от MEXC
  </div>
  
  <button id="connectBtn">Подключиться</button>
  <button id="openMexcBtn">Открыть MEXC</button>
  
  <div style="margin-top: 15px; font-size: 12px; color: #9ca3af;">
    <p>1. Откройте MEXC в браузере</p>
    <p>2. Войдите в аккаунт</p>
    <p>3. Перейдите на страницу тикера</p>
    <p>4. Нажмите "Подключиться"</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
