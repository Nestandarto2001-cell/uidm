<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МексоЁБ</title>
  <style>
    body {
      width: 280px;
      padding: 20px;
      margin: 0;
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff0000;
    }
    
    .status-indicator.connected {
      background: #00ff00;
    }
    
    .status-indicator.degraded {
      background: #ffff00;
    }
    
    .status-text {
      font-size: 11px;
      color: #888888;
      font-weight: 500;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 10px 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      color: #ffffff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      letter-spacing: -0.01em;
    }
    
    .btn:hover {
      background: #1a1a1a;
      border-color: #333333;
    }
    
    .btn.primary {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
      font-weight: 600;
    }
    
    .btn.primary:hover {
      background: #f0f0f0;
      border-color: #f0f0f0;
    }
    
    .info {
      margin-top: 16px;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      font-size: 10px;
      color: #666666;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>МексоЁБ</h1>
  </div>
  
  <div class="status">
    <div>
      <div class="status-indicator" id="statusIndicator"></div>
    </div>
    <div class="status-text" id="statusText">Проверка...</div>
  </div>
  
  <div class="actions">
    <button class="btn" id="diagnosticBtn">Диагностика</button>
    <button class="btn primary" id="refreshBtn">Обновить</button>
  </div>
  
  <div class="actions" style="margin-top: 8px;">
    <button class="btn primary" id="openTerminalBtn">Терминал</button>
    <button class="btn" id="startServerBtn">Запуск сервера</button>
  </div>
  
  <div class="info">
    <div>v1.0.0</div>
    <div><span id="versionStatus">Загрузка...</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
